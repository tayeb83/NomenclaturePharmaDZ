<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maquettes — rendre interactions et allergies visibles sur la fiche</title>
<style>
:root{--navy:#12233f;--navyD:#0b1730;--blue:#1d4e9e;--blueD:#173f82;--brass:#b98425;--brassL:#e3b65b;--brassD:#8a5f12;--teal:#1e8e8a;--tealL:#e2f1ef;--cream:#fbf7ec;--edge:#efe4c8;--ink:#12233f;--muted:#5b6577;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;--rose:#9b1c3a;--roseL:#fbe7ea;--bg:#eef1f3}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header.top{background:var(--navy);color:#fff;padding:18px 24px}header.top h1{margin:0;font-size:20px}header.top p{margin:4px 0 0;color:#cbd5e1;font-size:14px}
.sel{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px;background:#fff;border-bottom:1px solid var(--s200);position:sticky;top:0;z-index:20}
.sel button{border:1.5px solid var(--s200);background:#fff;border-radius:10px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer;font-size:14px}
.sel button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sel button.reco::after{content:" ★";color:var(--brass)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.var{display:none}.var.on{display:block}
.note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px;line-height:1.55}.note b{color:#78350f}
.pb{display:grid;grid-template-columns:1fr;gap:6px;margin:0 0 14px;font-size:13.5px;color:var(--muted)}
.pb b{color:var(--navy)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
@media(max-width:1000px){.pair{grid-template-columns:1fr}}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:0 0 6px}
/* cadres : une page qui défile, comme dans le navigateur */
.frame{height:640px;overflow:auto;background:#f1f4f4;border:1px solid var(--s300);border-radius:12px;position:relative;container-type:inline-size;container-name:fiche}
.phone{border:9px solid #1e293b;border-radius:30px;height:660px}
.fx{position:relative}
.hero{background:linear-gradient(135deg,#0f172a,#0c2340);color:#fff;padding:18px 22px}
.hero small{display:block;font:600 10.5px ui-monospace,monospace;letter-spacing:.08em;color:#94a3b8}
.hero b{font-size:22px;display:block;margin:6px 0 2px;font-family:Georgia,serif}
.hero i{font-style:normal;font-size:12px;background:#d1fae5;color:#065f46;border-radius:999px;padding:2px 10px;font-weight:700}
.pad{padding:14px 18px}
.ghost{background:#fff;border:1px solid #d6d6d6;margin-bottom:12px}
.ghost h5{margin:0;background:#e8e8e8;padding:7px 12px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#222}
.ghost div{padding:10px 12px;display:grid;gap:8px}.ghost span{height:9px;border-radius:5px;background:#e5e7eb;display:block}.ghost span:nth-child(2n){width:70%}.ghost span:nth-child(3n){width:45%}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@container fiche (max-width:640px){.layout{grid-template-columns:1fr}.hide-m{display:none!important}.pad{padding:12px}.hero{padding:14px 16px}.hero b{font-size:19px}}
@container fiche (min-width:641px){.show-m{display:none!important}}
/* pastilles communes */
.sev{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 11px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.sev.ci{background:var(--navyD)}.sev.dec{background:var(--blue)}.sev.pre{background:var(--brass)}.sev.pec{background:var(--teal)}
.hdo{display:inline-block;font:500 11.5px/1.7 ui-monospace,monospace;padding:0 7px;border-radius:5px;background:var(--roseL);color:var(--rose);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1.5px solid var(--edge);background:#fff;padding:3px 11px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;font-family:inherit}
.pill.rose{border-color:#f3c5cd;background:var(--roseL);color:var(--rose)}
.btn{display:inline-block;border:0;border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}.btn.o{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.card{background:var(--cream);border:1px solid var(--edge);border-top:3px solid var(--brass);border-radius:12px}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--edge);flex-wrap:wrap}.item:first-child{border-top:0}
.item b{color:var(--navy)}.item small{color:var(--muted)}
.ex{font-size:11px;background:var(--s100);color:#64748b;border-radius:6px;padding:1px 7px}
h3.g{margin:12px 0 2px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* A */
.bandeau{margin:12px 18px 14px;border:1px solid var(--edge);border-top:4px solid var(--brass);border-radius:14px;background:var(--cream);box-shadow:0 4px 14px rgba(18,35,63,.1);overflow:hidden}
.bandeau .row{display:grid;grid-template-columns:1fr 1fr}
.bandeau .col{padding:11px 14px;display:grid;gap:7px;align-content:start}.bandeau .col+.col{border-inline-start:1px solid var(--edge)}
.bandeau h4{margin:0;font-family:Georgia,serif;font-size:16px;color:var(--navy);display:flex;gap:8px;align-items:center}
.bandeau .chips{display:flex;gap:6px;flex-wrap:wrap}
.bandeau .more{font-size:13px;font-weight:700;color:var(--brassD);cursor:pointer;border:0;background:none;padding:0;text-align:start;font-family:inherit}
.apercu{display:none;border-top:1px solid var(--edge);background:#fff;padding:10px 14px}.apercu.on{display:block}
@container fiche (max-width:640px){.bandeau{margin:10px 12px}.bandeau .row{grid-template-columns:1fr}.bandeau .col+.col{border-inline-start:0;border-top:1px solid var(--edge)}}
/* B */
.aside{position:sticky;top:12px}
.sec{padding:12px 14px;display:grid;gap:8px}
.sec h4{margin:0;font-family:Georgia,serif;font-size:17px;color:var(--navy);display:flex;gap:8px;align-items:center}
.barre{position:sticky;bottom:0;display:none;gap:8px;padding:9px 10px;background:#fff;border-top:2px solid var(--brass);box-shadow:0 -6px 16px rgba(18,35,63,.14);z-index:5}
.barre .pill{flex:1;justify-content:center;padding:9px 8px;font-size:13.5px}
@container fiche (max-width:640px){.barre{display:flex}.aside{position:static}}
/* C */
.onglets{position:sticky;top:0;z-index:6;background:#fff;border-bottom:2px solid var(--edge);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 12px}
.onglets button{flex:none;border:0;background:none;font:inherit;font-weight:700;font-size:14.5px;color:var(--muted);padding:12px 13px 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;gap:6px;align-items:center}
.onglets button.on{color:var(--blue);border-bottom-color:var(--brass)}
.onglets i{font:normal 11.5px ui-monospace,monospace;background:var(--s100);border-radius:999px;padding:0 7px;color:#475569}
.onglets i.alerte{background:var(--blue);color:#fff}.onglets i.rose{background:var(--roseL);color:var(--rose)}
.panel{display:none}.panel.on{display:block}
.carte{background:#fff;border:1px solid #a9c3e6;border-top:3px solid var(--blue);border-radius:10px;margin-bottom:10px;overflow:hidden}.carte.pre{border-color:#e3c98a;border-top-color:var(--brass)}
.carte header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#e4edf7}.carte.pre header{background:#f8ebc8}
.carte header b{font-family:Georgia,serif;font-size:17px}
.carte p{margin:0;padding:8px 12px;font-size:13.5px;color:#334155;line-height:1.55}
.cols2{display:grid;grid-template-columns:1fr 1fr}.cols2>div+div{border-inline-start:1px solid var(--edge)}
@container fiche (max-width:640px){.cols2{grid-template-columns:1fr}.cols2>div+div{border-inline-start:0;border-top:1px solid var(--edge)}}
/* D */
.voile{position:absolute;inset:0;background:rgba(11,23,48,.45);display:none;z-index:8}.voile.on{display:block}
.tiroir{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(420px,92%);background:#fff;box-shadow:-10px 0 30px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .25s;z-index:9;display:flex;flex-direction:column}.tiroir.on{transform:none}
@container fiche (max-width:640px){.tiroir{top:auto;inset-inline:0;width:auto;height:78%;border-radius:18px 18px 0 0;transform:translateY(105%)}.tiroir.on{transform:none}}
.tiroir .th{padding:12px 14px;background:linear-gradient(135deg,var(--blueD),var(--navyD));color:#fff;display:flex;justify-content:space-between;align-items:center}
.tiroir .th b{font-family:Georgia,serif;font-size:19px;color:var(--brassL)}
.tiroir .th button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.seg{display:flex;gap:6px;padding:10px 14px 0}.seg button{flex:1;border:1.5px solid var(--edge);background:#fff;border-radius:999px;padding:7px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--navy)}.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tiroir .tb{padding:10px 14px;overflow:auto;flex:1}
.tiroir input{width:100%;font:inherit;font-size:14px;padding:7px 11px;border:1.5px solid var(--s300);border-radius:8px;margin:10px 0 6px}
.fab{position:absolute;inset-inline-end:14px;bottom:14px;z-index:7;border:0;border-radius:999px;background:var(--navy);color:#fff;font:inherit;font-weight:700;font-size:14px;padding:11px 16px;box-shadow:0 8px 20px rgba(11,23,48,.4);cursor:pointer;display:flex;gap:8px;align-items:center;position:sticky;margin-inline-start:auto;bottom:14px}
.fab .sev{padding:0 8px}
</style></head><body>
<header class="top"><h1>Maquettes — interactions et allergies plus visibles sur la fiche</h1>
<p>Exemple : AMOXICILLINE (3 allergies HDO réelles). Les interactions sont des <b>données d’exemple</b> (mise en page seulement). Chaque cadre défile comme la vraie page ; à gauche l’ordinateur, à droite le téléphone.</p></header>
<div class="sel" id="sel">
<button data-v="0" class="on">Aujourd’hui</button>
<button data-v="a">A · Bandeau Sécurité</button>
<button data-v="b">B · Carte collante</button>
<button data-v="c">C · Onglets collants</button>
<button data-v="d">D · Tiroir</button>
<button data-v="e" class="reco">E · Combiné</button>
</div>
<main id="main"></main>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const INTER=[
 {niv:'dec',n:'Méthotrexate',t:'Substance'},
 {niv:'pre',n:'Anticoagulants oraux',t:'Classe'},
 {niv:'pre',n:'Probénécide',t:'Substance'}];
const ALL=[
 {c:'0040004',s:'',l:'Allergie — amoxicilline',r:'substance'},
 {c:'0060520',s:' ⊂',l:'Allergie — pénicillines',r:'classe ATC J01C'},
 {c:'0060519',s:' ⊂',l:'Allergie — bêta-lactamines',r:'classes ATC J01C + J01D'}];
const NIV={dec:['▲','Association déconseillée','déconseillée'],pre:['◆','Précaution d’emploi','précaution'],ci:['⊗','Contre-indication','contre-indication']};
const nDec=INTER.filter(i=>i.niv==='dec').length,nPre=INTER.filter(i=>i.niv==='pre').length;
const chipsInter=()=>`${nDec?`<span class="sev dec">▲ ${nDec} déconseillée</span>`:''}${nPre?`<span class="sev pre">◆ ${nPre} précautions</span>`:''}`;
const chipsAll=()=>ALL.map(a=>`<span class="hdo">HDO ${a.c}${a.s}</span>`).join(' ');
const ghost=(t,n=4)=>`<div class="ghost"><h5>${t}</h5><div>${'<span></span>'.repeat(n)}</div></div>`;
const hero=()=>`<div class="hero"><small>DCI — DÉNOMINATION COMMUNE INTERNATIONALE</small><b>AMOXICILLINE 500 mg gélule</b><i>✅ Médicament actif</i></div>`;
const share=()=>`<div class="pad" style="padding-bottom:0"><div style="border:1px solid var(--edge);background:var(--cream);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--brassD);font-weight:700">Partager cette fiche · Facebook · WhatsApp · Copier le lien</div></div>`;
const resume=()=>`<div class="pad" style="padding-bottom:0"><p style="margin:0;font-size:13px;color:#334155;line-height:1.6">AMOXICILLINE 500 MG est un médicament sous forme de gélule dont la substance active est AMOXICILLINE… <span class="ex">texte SEO</span></p></div>`;
const corps=()=>`<div class="pad"><div class="layout"><div>${ghost('Identification',5)}${ghost('Conditionnement',6)}${ghost('Fabricant',3)}</div><div class="hide-m">${ghost('Repères',5)}</div></div></div>`;
const listeInter=(tout=true)=>INTER.map(i=>`<div class="item"><span class="sev ${i.niv}">${NIV[i.niv][0]} ${NIV[i.niv][2]}</span><b>${i.n}</b><small>${i.t}</small></div>`).join('');
const listeAll=()=>ALL.map(a=>`<div class="item"><a class="hdo">HDO ${a.c}${a.s}</a><b>${a.l}</b><small>${a.r}</small></div>`).join('');
const carteInter=(i)=>`<div class="carte ${i.niv==='pre'?'pre':''}"><header><span class="sev ${i.niv}">${NIV[i.niv][0]} ${NIV[i.niv][2]}</span><b>${i.n}</b><small style="color:var(--muted)">${i.t}</small></header><div class="cols2"><div><p><b style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Risques</b><br>Texte ANSM affiché ici <span class="ex">exemple de mise en page</span></p></div><div><p><b style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Conduite à tenir</b><br>Texte ANSM affiché ici <span class="ex">exemple</span></p></div></div></div>`;
const frames=(inner)=>`<div class="pair"><div><p class="lbl">Ordinateur</p><div class="frame" data-f>${inner}</div></div><div><p class="lbl">Téléphone</p><div class="frame phone" data-f>${inner}</div></div></div>`;
const bar=(t)=>`<div class="pb">${t}</div>`;
const note=(t)=>`<div class="note">${t}</div>`;

const V={};
V['0']=()=>note('<b>Aujourd’hui.</b> Le bandeau ne parle que des interactions et se trouve sous le texte SEO. Les allergies ne sont nulle part avant la section du bas. Mesuré sur une vraie fiche (kétoprofène) : sur ordinateur les interactions démarrent à <b>1 335 px</b> et les allergies à <b>2 219 px</b> d’une page de 5 285 px ; sur téléphone, à <b>2 264 px</b> et <b>3 789 px</b> sur 9 304 px (40 % de la page).')+
 frames(`<div class="fx">${hero()}${share()}${resume()}<div class="pad" style="padding-bottom:0"><div class="card" style="padding:9px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-family:Georgia,serif;font-size:16px">✷ Interactions médicamenteuses</b>${chipsInter()}<span style="margin-inline-start:auto;font-weight:700;color:var(--brassD);font-size:13px">À vérifier ›</span></div></div>${corps()}${ghost('… 800 px plus bas : Interactions (section complète)',3)}${ghost('… 900 px plus bas : Allergies documentées',3)}</div>`);

V.a=()=>note('<b>A · Bandeau Sécurité unifié.</b> Un seul bandeau, sous le titre et <i>avant</i> le texte SEO, qui réunit les deux sujets. Il résume (compteurs par gravité, codes HDO) et s’<b>ouvre sur place</b> en aperçu, sans quitter le haut de la fiche ; « Tout voir » mène au détail. Sur téléphone les deux colonnes s’empilent.')+
 bar('<span><b>Gain :</b> visible dès le premier écran, interactions et allergies ensemble, aperçu sans défilement.</span><span><b>Coût :</b> un composant de plus en haut de page ; le détail reste en bas.</span>')+
 frames(`<div class="fx">${hero()}<div id="A"></div>${share()}${resume()}${corps()}</div>`);
V.b=()=>note('<b>B · Carte Sécurité collante.</b> Sur ordinateur, une carte reste visible dans la colonne « Repères » pendant tout le défilement : les interactions les plus graves, les allergies, deux boutons. Sur téléphone, elle devient une <b>barre basse</b> fixe avec deux pastilles qui mènent au détail.')+
 bar('<span><b>Gain :</b> toujours à l’écran, jamais « perdu » dans la page.</span><span><b>Coût :</b> prend la place du bloc « Repères » (à raccourcir) ; barre basse à ne pas confondre avec le bandeau cookies.</span>')+
 frames(`<div class="fx">${hero()}${share()}${resume()}<div class="pad"><div class="layout"><div>${ghost('Identification',6)}${ghost('Conditionnement',7)}${ghost('Fabricant',4)}${ghost('Dates',3)}</div><div class="aside hide-m"><div class="card"><div class="sec"><h4>🛡 Sécurité d’emploi</h4><div class="chips" style="display:flex;gap:6px;flex-wrap:wrap">${chipsInter()}</div>${listeInter()}<h3 class="g" style="margin:2px 0">Allergies documentées</h3>${listeAll()}<a class="btn">Voir les interactions</a><a class="btn o">Voir les allergies</a></div></div></div></div></div><div class="barre show-m"><button class="pill">⚠ ${INTER.length} interactions <span class="sev dec" style="padding:0 7px">▲ ${nDec}</span></button><button class="pill rose">🩺 ${ALL.length} allergies</button></div></div>`);
V.c=()=>note('<b>C · Onglets collants.</b> La fiche devient « Essentiel · Interactions · Allergies · Génériques · RCP ». La barre d’onglets reste collée sous le menu, chaque onglet porte son <b>compteur</b> (bleu quand une association est déconseillée ou contre-indiquée). Un seul sujet à l’écran à la fois : plus de page de 5 000 px.')+
 bar('<span><b>Gain :</b> navigation claire, page courte, compteurs toujours visibles.</span><span><b>Coût :</b> change l’habitude (tout était sur une page) et le référencement : les panneaux doivent rester dans le HTML.</span>')+
 frames(`<div class="fx">${hero()}<div class="onglets" data-tabs><button class="on" data-t="es">Essentiel</button><button data-t="in">Interactions <i class="alerte">${INTER.length}</i></button><button data-t="al">Allergies <i class="rose">${ALL.length}</i></button><button data-t="ge">Génériques <i>9</i></button><button data-t="rc">RCP</button></div>
 <div class="panel on" data-p="es">${share()}${resume()}${corps()}</div>
 <div class="panel" data-p="in"><div class="pad"><div class="chips" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${chipsInter()}</div>${INTER.map(carteInter).join('')}</div></div>
 <div class="panel" data-p="al"><div class="pad"><div class="card"><div class="sec"><h3 class="g" style="margin:0">Cette substance</h3>${ALL.slice(0,1).map(a=>`<div class="item"><a class="hdo">HDO ${a.c}</a><b>${a.l}</b><small>${a.r}</small></div>`).join('')}<h3 class="g">Classes (selon l’ATC)</h3>${ALL.slice(1).map(a=>`<div class="item"><a class="hdo">HDO ${a.c}${a.s}</a><b>${a.l}</b><small>${a.r}</small></div>`).join('')}<details style="border:1px dashed var(--s300);border-radius:8px;padding:6px 10px;opacity:.7"><summary style="cursor:pointer;font-weight:600;font-size:13px">Excipients à surveiller, non évaluables (8)</summary></details></div></div></div></div>
 <div class="panel" data-p="ge"><div class="pad">${ghost('9 génériques',6)}</div></div><div class="panel" data-p="rc"><div class="pad">${ghost('RCP officiel',5)}</div></div></div>`);
V.d=()=>note('<b>D · Tiroir « Sécurité d’emploi ».</b> Un bouton flottant (compteurs inclus) ouvre un tiroir latéral sur ordinateur, une feuille montante sur téléphone : interactions et allergies en deux onglets, avec recherche. On consulte sans perdre sa place dans la fiche.')+
 bar('<span><b>Gain :</b> n’encombre pas la page, accessible de partout.</span><span><b>Coût :</b> contenu moins « trouvable » (rien dans la page elle-même) : à coupler avec un bandeau ou des onglets.</span>')+
 frames(`<div class="fx">${hero()}${share()}${resume()}${corps()}${ghost('Génériques',6)}${ghost('RCP',6)}
 <div class="voile" data-v></div>
 <div class="tiroir" data-d><div class="th"><b>🛡 Sécurité d’emploi</b><button data-close>✕</button></div>
  <div class="seg" data-seg><button class="on" data-s="in">Interactions ${INTER.length}</button><button data-s="al">Allergies ${ALL.length}</button></div>
  <div class="tb"><input placeholder="Chercher une substance ou une classe…"><div data-sp="in">${chipsInter()}<div style="margin-top:8px">${listeInter()}</div></div><div data-sp="al" style="display:none">${listeAll()}<p style="font-size:12.5px;color:var(--muted)">Information, pas une contre-indication. Aucune allergie croisée n’est déduite.</p></div></div></div>
 <button class="fab" data-open>🛡 Sécurité d’emploi <span class="sev dec">▲ ${nDec}</span><span class="sev pre">◆ ${nPre}</span><span class="hdo">🩺 ${ALL.length}</span></button></div>`);
V.e=()=>note('<b>E · Combiné (ma recommandation).</b> <b>A</b> en tête pour la visibilité immédiate (résumé + aperçu), <b>C</b> pour le détail, avec onglets collants et compteurs, et <b>la barre basse de B sur téléphone</b>. Chaque élément répond à un défaut mesuré : le haut de page dit l’essentiel, la navigation donne le détail, le mobile garde l’accès sous le pouce.')+
 bar('<span><b>Parcours :</b> 1) le bandeau signale « ▲ 1 déconseillée · 🩺 3 allergies » ; 2) un clic ouvre l’aperçu ; 3) « Tout voir » active l’onglet correspondant ; 4) sur mobile la barre basse suit.</span>')+
 frames(`<div class="fx">${hero()}<div id="E"></div>
 <div class="onglets" data-tabs><button class="on" data-t="es">Essentiel</button><button data-t="in">Interactions <i class="alerte">${INTER.length}</i></button><button data-t="al">Allergies <i class="rose">${ALL.length}</i></button><button data-t="ge">Génériques <i>9</i></button></div>
 <div class="panel on" data-p="es">${share()}${resume()}${corps()}</div>
 <div class="panel" data-p="in"><div class="pad">${INTER.map(carteInter).join('')}</div></div>
 <div class="panel" data-p="al"><div class="pad"><div class="card"><div class="sec">${listeAll()}</div></div></div></div>
 <div class="panel" data-p="ge"><div class="pad">${ghost('9 génériques',6)}</div></div>
 <div class="barre show-m"><button class="pill" data-go="in">⚠ ${INTER.length} interactions <span class="sev dec" style="padding:0 7px">▲ ${nDec}</span></button><button class="pill rose" data-go="al">🩺 ${ALL.length} allergies</button></div></div>`);

const bandeau=(id)=>`<div class="bandeau"><div class="row">
 <div class="col"><h4>✷ Interactions</h4><div class="chips">${chipsInter()}</div><button class="more" data-ap="in">Aperçu ▾</button></div>
 <div class="col"><h4>🩺 Allergies documentées</h4><div class="chips">${chipsAll()}</div><button class="more" data-ap="al">Aperçu ▾</button></div></div>
 <div class="apercu" data-apercu="in">${listeInter()}<p style="margin:8px 0 0"><button class="btn" data-go="in">Tout voir (${INTER.length}) ›</button></p></div>
 <div class="apercu" data-apercu="al">${listeAll()}<p style="margin:8px 0 0"><button class="btn" data-go="al">Tout voir (${ALL.length}) ›</button></p></div></div>`;

function wire(root){
 root.querySelectorAll('[data-f]').forEach(f=>{
  const A=f.querySelector('#A,#E'); if(A) A.outerHTML=bandeau();
  f.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{const k=b.dataset.ap,p=f.querySelector(`[data-apercu=${k}]`),on=!p.classList.contains('on');f.querySelectorAll('[data-apercu]').forEach(x=>x.classList.remove('on'));if(on)p.classList.add('on')});
  const tabs=f.querySelector('[data-tabs]');
  const go=t=>{ if(!tabs)return; tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.t===t)); f.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.dataset.p===t)); f.scrollTo({top:f.querySelector('.onglets')?.offsetTop??0,behavior:'smooth'}); };
  if(tabs) tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  f.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  const d=f.querySelector('[data-d]'),v=f.querySelector('[data-v]');
  if(d){ const op=()=>{d.classList.add('on');v.classList.add('on')},cl=()=>{d.classList.remove('on');v.classList.remove('on')};
   f.querySelector('[data-open]').onclick=op; f.querySelector('[data-close]').onclick=cl; v.onclick=cl;
   f.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{f.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));f.querySelectorAll('[data-sp]').forEach(p=>p.style.display=p.dataset.sp===b.dataset.s?'block':'none')}); }
 });
}
function show(k){ $('#main').innerHTML=V[k](); wire($('#main')); $$('#sel button').forEach(b=>b.classList.toggle('on',b.dataset.v===k)); history.replaceState(null,'','#'+k); }
$$('#sel button').forEach(b=>b.onclick=()=>show(b.dataset.v));
const depuisHash=()=>V[location.hash.slice(1)]?location.hash.slice(1):'0';
window.addEventListener('hashchange',()=>show(depuisHash()));
show(depuisHash());
</script></body></html>
