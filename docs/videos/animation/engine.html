<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/cairo-arabic-800-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/cairo-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122}
html,body{margin:0;background:#0b2e3a;overflow:hidden}
svg{display:block;font-family:Cairo,"Noto Color Emoji",sans-serif;font-weight:800}
</style></head>
<body><svg id="s" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920"></svg>
<script>
// Moteur minimal : un épisode (episodes/<nom>.js) définit window.EP = { duration, subs, init(svg,h), update(t,h) }.
// Le rendu est déterministe : renderAt(t) dessine l'image exacte du temps t (pas d'horloge réelle).
const NS = "http://www.w3.org/2000/svg";
const H = {
  el(tag, attrs = {}, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  },
  clamp: (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)),
  prog: (t, a, b) => H.clamp((t - a) / (b - a)),
  outBack: (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outCubic: (x) => 1 - Math.pow(1 - x, 3),
  inOut: (x) => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2,
  place(g, x, y, s = 1, r = 0, o = 1) {
    g.setAttribute("transform", `translate(${x} ${y}) rotate(${r}) scale(${s})`);
    g.setAttribute("opacity", o);
  },
};
const q = new URLSearchParams(location.search);
const burn = q.get("subs") !== "0";
let EP, subG, subAr, subFr, subBg;
function load(src) {
  return new Promise((ok) => { const s = document.createElement("script"); s.src = src; s.onload = ok; document.head.appendChild(s); });
}
async function boot() {
  await load("lib/spec.js"); // aides pour les épisodes « par spécification »
  await load("episodes/" + q.get("ep") + ".js");
  if (window.SPEC) await load("lib/build.js");
  EP = window.EP;
  const svg = document.getElementById("s");
  EP.init(svg, H);
  subG = H.el("g", {}, svg);
  subBg = H.el("rect", { x: 60, y: 1480, width: 960, height: 410, rx: 36, fill: "#000", "fill-opacity": .62 }, subG);
  subAr = H.el("text", { x: 540, "text-anchor": "middle", direction: "rtl", fill: "#fff", "font-size": 62 }, subG);
  subFr = H.el("text", { x: 540, "text-anchor": "middle", fill: "#ffe08a", "font-size": 42 }, subG);
  await document.fonts.ready;
  if (EP.afterFonts) EP.afterFonts();
  window.renderAt = (t) => {
    EP.update(t, H);
    const cur = EP.subs.find((s) => t >= s.start && t < s.end);
    subG.setAttribute("display", burn && cur ? "" : "none");
    if (cur) {
      subAr.innerHTML = ""; subFr.innerHTML = "";
      const fit = (ts, base) => { // réduit la police d'une ligne si elle dépasse la largeur du cadre
        const w = ts.getComputedTextLength();
        if (w > 880) ts.setAttribute("font-size", Math.floor(base * 880 / w));
      };
      cur.ar.forEach((l, i) => { const ts = H.el("tspan", { x: 540, y: 1565 + i * 72, "font-size": 62 }, subAr); ts.textContent = l; fit(ts, 62); });
      const y0 = 1565 + (cur.ar.length - 1) * 72 + 64;
      cur.fr.forEach((l, i) => { const ts = H.el("tspan", { x: 540, y: y0 + i * 48, "font-size": 40 }, subFr); ts.textContent = l; fit(ts, 40); });
    }
  };
  window.EP_READY = true;
}
boot();
</script></body></html>
