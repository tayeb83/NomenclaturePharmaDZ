<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/cairo-arabic-800-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/cairo-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122}
html,body{margin:0;background:#071f29}svg{display:block;font-family:Cairo,sans-serif;font-weight:800}
</style></head><body><svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// Couverture d'une vidéo : ?fmt=v (1080×1920, zone utile centrale 3:4 pour la carte du site) ou ?fmt=h (1200×630, partage Facebook).
const NS = "http://www.w3.org/2000/svg", q = new URLSearchParams(location.search), V = q.get("fmt") !== "h";
const W = V ? 1080 : 1200, H = V ? 1920 : 630;
const svg = document.getElementById("s"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
const el = (t, a = {}, p = svg) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const txt = (s, a, p = svg) => { const e = el("text", a, p); e.textContent = s; return e; };

const defs = el("defs"); const g = el("linearGradient", { id: "bg", x1: 0, y1: 0, x2: V ? 0 : 1, y2: V ? 1 : 1 }, defs);
el("stop", { offset: 0, "stop-color": "#0f4c5c" }, g); el("stop", { offset: 1, "stop-color": "#071f29" }, g);
el("rect", { width: W, height: H, fill: "url(#bg)" });
for (let i = 0; i < 9; i++) el("circle", { cx: (i * 131 + 90) % W, cy: (i * 233 + 120) % H, r: 20 + (i * 17) % 50, fill: "#fff", "fill-opacity": .06 });

function pill(parent, x, y, s) {
  const p = el("g", { transform: `translate(${x} ${y}) scale(${s})` }, parent);
  el("rect", { x: -230, y: -80, width: 460, height: 160, rx: 80, fill: "#fff" }, p);
  el("path", { d: "M0 -80 H150 A80 80 0 0 1 150 80 H0 Z", fill: "#ff9f1c" }, p);
  txt("PARACETAMOL", { x: 0, y: 16, "text-anchor": "middle", fill: "#111", "font-size": 54 }, p);
}
function box(parent, x, y, c, name, s) {
  const b = el("g", { transform: `translate(${x} ${y}) scale(${s})` }, parent);
  el("rect", { x: -150, y: -110, width: 300, height: 220, rx: 50, fill: c, stroke: "#fff", "stroke-width": 8 }, b);
  txt(name, { x: 0, y: -48, "text-anchor": "middle", fill: "#fff", "font-size": 40 }, b);
  [-45, 45].forEach((dx) => { el("ellipse", { cx: dx, cy: 10, rx: 24, ry: 28, fill: "#fff" }, b); el("circle", { cx: dx, cy: 14, r: 12, fill: "#222" }, b); });
  el("path", { d: "M-40 62 Q0 100 40 62", stroke: "#fff", "stroke-width": 9, fill: "none", "stroke-linecap": "round" }, b);
}
function illustration(parent, cx, cy, s) { // trois marques → une seule substance active
  const g2 = el("g", { transform: `translate(${cx} ${cy}) scale(${s})` }, parent);
  [[-320, "#ff6b6b", "DOLIPRANE"], [0, "#4dabf7", "EFFERALGAN"], [320, "#51cf66", "DAFALGAN"]].forEach(([dx, c, n]) => {
    box(g2, dx, -230, c, n, 1);
    el("path", { d: `M${dx} -100 Q${dx / 2} 20 0 110`, stroke: "#fff", "stroke-width": 10, fill: "none", "stroke-linecap": "round", opacity: .85 }, g2);
  });
  pill(g2, 0, 210, 1);
  const tag = el("g", { transform: "translate(0 60)" }, g2); el("rect", { x: -120, y: -42, width: 240, height: 84, rx: 42, fill: "#e03131", stroke: "#fff", "stroke-width": 6 }, tag);
  txt("DCI", { x: 0, y: 20, "text-anchor": "middle", fill: "#fff", "font-size": 56 }, tag);
}

if (V) {
  txt("DwaDZ", { x: 540, y: 330, "text-anchor": "middle", fill: "#ffd166", "font-size": 64 });
  txt("فيديو تعليمي · Vidéo pédagogique", { x: 540, y: 400, "text-anchor": "middle", fill: "#cfe8ee", "font-size": 40 });
  txt("ما هي الـ DCI؟", { x: 540, y: 630, "text-anchor": "middle", fill: "#ffd166", "font-size": 132, direction: "rtl" });
  txt("C'est quoi une DCI ?", { x: 540, y: 740, "text-anchor": "middle", fill: "#fff", "font-size": 76 });
  illustration(svg, 540, 1130, 1.0);
  txt("أسماء كثيرة، مادة فعالة واحدة", { x: 540, y: 1520, "text-anchor": "middle", fill: "#fff", "font-size": 70, direction: "rtl" });
  txt("Plusieurs noms, une seule substance active", { x: 540, y: 1590, "text-anchor": "middle", fill: "#cfe8ee", "font-size": 38 });
  txt("dzair-pharma.net", { x: 540, y: 1650, "text-anchor": "middle", fill: "#ffd166", "font-size": 40 });
} else {
  txt("DwaDZ", { x: 70, y: 90, fill: "#ffd166", "font-size": 52 });
  txt("ما هي الـ DCI؟", { x: 340, y: 235, "text-anchor": "middle", fill: "#ffd166", "font-size": 104, direction: "rtl" });
  txt("C'est quoi une DCI ?", { x: 340, y: 325, "text-anchor": "middle", fill: "#fff", "font-size": 52 });
  txt("أسماء كثيرة، مادة فعالة واحدة", { x: 340, y: 440, "text-anchor": "middle", fill: "#fff", "font-size": 40, direction: "rtl" });
  txt("Plusieurs noms, une seule substance active", { x: 340, y: 490, "text-anchor": "middle", fill: "#cfe8ee", "font-size": 27 });
  txt("dzair-pharma.net", { x: 70, y: 585, fill: "#ffd166", "font-size": 34 });
  illustration(svg, 900, 295, 0.42);
}
document.fonts.ready.then(() => { window.READY = true });
</script></body></html>
