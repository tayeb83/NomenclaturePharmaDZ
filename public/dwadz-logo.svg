<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="DwaDZ logo">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="pillGreenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <clipPath id="capsuleClip">
      <rect x="14" y="32" width="64" height="26" rx="13"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Main capsule pill (tilted -30°) -->
  <g transform="rotate(-30,46,47)">
    <rect x="14" y="32" width="64" height="26" rx="13" fill="white" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    <rect x="14" y="32" width="32" height="26" rx="13" fill="url(#pillGreenGrad)" clip-path="url(#capsuleClip)"/>
    <line x1="46" y1="32" x2="46" y2="58" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
    <rect x="16" y="34" width="60" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>
  </g>

  <!-- Red oval tablet -->
  <ellipse cx="84" cy="80" rx="18" ry="12" fill="url(#redGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <ellipse cx="80" cy="76" rx="7" ry="4" fill="rgba(255,255,255,0.22)" transform="rotate(-15,80,76)"/>

  <!-- Small white+red half-capsule (bottom left) -->
  <g transform="rotate(15,26,88)">
    <rect x="14" y="82" width="24" height="12" rx="6" fill="rgba(255,255,255,0.85)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <rect x="14" y="82" width="12" height="12" rx="6" fill="rgba(220,38,38,0.8)"/>
  </g>

  <!-- "DZ" badge top-right -->
  <circle cx="92" cy="28" r="16" fill="rgba(0,0,0,0.25)"/>
  <text x="92" y="33" fill="white" font-size="13" font-weight="900" text-anchor="middle"
        font-family="'DM Sans',Arial,sans-serif" letter-spacing="-0.5">DZ</text>
</svg>
