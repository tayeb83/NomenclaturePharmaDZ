<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="DwaDZ logo">
  <defs>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b8e3f"/>
      <stop offset="100%" stop-color="#047532"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff253c"/>
      <stop offset="100%" stop-color="#df0a24"/>
    </linearGradient>
  </defs>

  <rect width="560" height="220" fill="none"/>

  <!-- Simple Algeria-inspired emblem -->
  <g transform="translate(20 20)">
    <rect x="0" y="0" width="90" height="90" rx="12" fill="#fff" stroke="#d1d5db"/>
    <rect x="0" y="0" width="45" height="90" rx="12" fill="#0a8f3d"/>
    <path d="M58 45a18 18 0 1 0 0 36a15 15 0 1 1 0-36Z" fill="#e6132a"/>
    <polygon points="67,56 69.8,63.2 77.5,63.2 71.2,67.8 73.8,75 67,70.6 60.2,75 62.8,67.8 56.5,63.2 64.2,63.2" fill="#e6132a"/>
  </g>

  <!-- Name -->
  <g transform="translate(128 112)">
    <text x="0" y="0" font-size="86" font-weight="900" font-family="Arial, Helvetica, sans-serif" fill="url(#gGreen)">Dwa</text>
    <text x="165" y="0" font-size="86" font-weight="900" font-family="Arial, Helvetica, sans-serif" fill="url(#gRed)">DZ</text>
  </g>

  <!-- Slogan -->
  <text x="128" y="170" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#4b5563">كلش على دوا البلاد</text>
</svg>
